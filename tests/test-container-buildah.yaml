# Test: Container build using buildah method with fedora-minimal base
# Validates that buildah can install packages into minimal base images without DNF

base: fedora-44-x86_64

build:
  - type: git
    url: {{REPO_BASE_URL}}
    packages:
      - rpm-build-assist:main

install:
  type: container
  build_method: buildah
  base_image: registry.fedoraproject.org/fedora-minimal:44
  tag: rpm-build-assist:buildah-test
  releasever: "44"
  packages:
    - rpm-build-assist
