# Test: Container build using buildah method with scratch base
# Validates that buildah can bootstrap packages into an empty container from scratch

base: fedora-44-x86_64

build:
  - type: git
    url: {{REPO_BASE_URL}}
    packages:
      - rpm-build-assist:main

install:
  type: container
  build_method: buildah
  base_image: scratch
  tag: rpm-build-assist:buildah-test
  releasever: "44"
  packages:
    - rpm-build-assist
    - bash  # Minimal shell for CMD
    - coreutils-single  # Basic utilities
