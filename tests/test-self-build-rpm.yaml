# Test: Build rpm-build-assist itself as an RPM
#
# Validates that rpm-build-assist can build itself from git.
# Run via test runner:
#   ./run-tests test-self-build-rpm.yaml
#
# Note: {{REPO_BASE_URL}} is substituted by the test runner with the
# parent directory of the working directory (e.g., file:///home/user/git/orb-project/)

base: fedora-44-x86_64

build:
  - type: git
    url: {{REPO_BASE_URL}}
    packages:
      - rpm-build-assist:main

# Standard installation (to /usr)
install:
  type: standard
